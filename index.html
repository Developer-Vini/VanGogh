<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VanGogh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black text-white text-2xl">
    <header class="top-0 fixed w-full h-16 z-50 bg-transparent">
        <div class="flex items-center justify-between h-16 max-w-7xl mx-auto px-4 ">
            <a class="font-heading text-2xl">Art</a>
            <nav class="flex gap-10 md:flex font-logo">
                <a class="font-heading transition hover:text-blue-300 cursor-pointer font-normal text-[24px]">Shop</a>
                <a
                    class="font-heading transition hover:text-blue-300 cursor-pointer font-normal text-[24px]">History</a>
                <a class="font-heading transition hover:text-blue-300 cursor-pointer font-normal text-[24px]">Artist</a>
                <a
                    class="font-heading transition hover:text-blue-300 cursor-pointer font-normal text-[24px]">Paintings</a>
            </nav>
        </div>
    </header>

    <section id="hero" class="relative w-full min-h-screen">
        <div class="absolute top-0 left-0 w-full h-full -z-20 ">
            <img class="w-full h-full object-cover object-center" src="src/assets/image.png" alt="background-image">
        </div>
        <div
            class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_center, transparent_90%, #000000_25%)] opacity-25">
        </div>
        <div class="absolute inset-0 -z-10 bg-gradient-to-t from-black via-transparent to-black/60"></div>

        <div class="flex flex-col items-center min-h-screen p-28 -translate-x-[22%] translate-y-[9%]">
            <h1 class="text-8xl text-center font-heading leading-28 tracking-[3px]">
                <span class="block">Paintings</span>
                <span class="block">Van Gogh</span>
            </h1>
            <p class="text-2xl leading-[150%] mt-6 font-logo leading-[150%]">Van Gogh is considered the greatest<br>a
                leading figure of Post-Impressionism.<br>
                Some point out in their works the<br>early signs of expressionism</p>
            <p class="text-[#ffb904] text-2xl font-heading leading-[100%] font-normal -translate-x-37 flex mt-4">Explore
                More</p>
            <div>
                <div class="relative flex flex-col gap-12">
                    <div
                        class="absolute left-[5px] top-1 bottom-1 border-l-2 border-dotted border-white/70 active flex items-center gap-6">
                    </div>
                    <div class="relative z-10 flex items-center gap-6">
                        <div class="w-3 h-3 rounded-full bg-amber-50"></div>
                        <p class="font-heading font-normal text-2xl">Van Gogh <span class="font-space font-light text-[16px]" >(1853–1890)</span></p>
                    </div>
                    <div class="relative z-10 flex items-center gap-6">
                        <div class="w-3 h-3 rounded-full bg-amber-50"></div>
                        <p class="font-heading font-normal text-2xl" >Michelangelo <span class="font-space font-light text-[16px]" >(14753–1570)</span></p>
                    </div>
                    <div class="relative z-10 flex items-center gap-6">
                        <div class="w-3 h-3 rounded-full bg-amber-50"></div>
                        <p class="font-heading font-normal text-2xl">Leonardo Da Vinci <span class="font-space font-light text-[16px]">(1452–1519)</span></p>
                    </div>
                </div>
            </div>
        </div>

    </section>
</body>

</html>
