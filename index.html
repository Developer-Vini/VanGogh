<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VanGogh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-black text-white text-2xl">
    <header class="top-0 fixed w-full h-16 z-50">
        <div class="flex items-center justify-between h-16 max-w-7xl mx-auto px-4 ">
            <a class="font-logo">Art</a>
            <nav class="flex gap-10 md:flex font-logo">
                <a class="transition hover:text-blue-300 cursor-pointer">Shop</a>
                <a class="transition hover:text-blue-300 cursor-pointer">History</a>
                <a class="transition hover:text-blue-300 cursor-pointer">Artist</a>
                <a class="transition hover:text-blue-300 cursor-pointer">Paintings</a>
            </nav>
        </div>
    </header>

    <section id="hero">
        <div class="absolute top-0">
            <img class="max-w-full" src="src/assets/image.png" alt="background-image">
        </div>
    </section>
</body>

</html>
